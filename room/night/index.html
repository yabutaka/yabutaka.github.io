<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takashi Yabuta · Desk</title>
<meta name="description" content="Takashi Yabuta's desk on a rainy Vancouver night. An interactive 3D version of yabutaka.github.io.">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=VT323&display=swap">
<style>
  :root {
    --fg: #e9e7f2;
    --muted: #8e8ca3;
    --link: #ff5a4e;
    --mark: #2f6bff;
    --body: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --display: "VT323", "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #07080d; color: var(--fg); font: 13px/1.6 var(--body); }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

  #hud {
    position: fixed; left: 16px; right: 16px; bottom: 16px;
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .who { font: 400 32px/1 var(--display); margin: 0; }
  .who small { display: block; font: 12px/1.6 var(--body); color: var(--muted); margin-top: 4px; }
  #sections { display: flex; flex-wrap: wrap; gap: 6px; }
  #sections button {
    font: inherit; color: var(--muted); background: rgba(10, 11, 18, .6);
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 4px 12px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: color .15s, border-color .15s;
  }
  #sections button:hover { color: var(--fg); }
  #sections button[aria-pressed="true"] { color: var(--fg); border-color: var(--link); }
  #sections button:focus-visible, a:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  #links { display: flex; gap: 16px; min-height: 1.6em; }
  a { color: var(--fg); text-decoration: underline 2px var(--link); text-underline-offset: 4px; }
  a:hover { text-decoration-thickness: 4px; }
  .corner { position: fixed; top: 16px; right: 16px; color: var(--muted); }
  .corner a { color: var(--muted); }

  #tip {
    position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0;
    font: 400 20px/1 var(--display); color: #d8ffe9; padding: 4px 8px;
    background: rgba(4, 12, 9, .8); border: 1px solid rgba(120, 255, 190, .3);
    transform: translate(14px, 14px); transition: opacity .12s; white-space: nowrap;
  }
  #veil {
    position: fixed; inset: 0; display: grid; place-items: center; background: #07080d;
    font: 400 28px var(--display); color: var(--muted); transition: opacity .8s; z-index: 2;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 600px) {
    #hud { flex-direction: column; align-items: stretch; }
    .who { font-size: 26px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="corner"><a href="/">plain version</a></div>
<nav class="sr-only" aria-label="Rooms">
  <a href="/room/">powder</a> <a href="/room/night/">night</a> <a href="/room/harbour/">harbour</a> <a href="/room/trailhead/">cabin</a>
</nav>

<div id="hud">
  <div>
    <p class="who">takashi yabuta<small>click things on the desk · esc to step back</small></p>
  </div>
  <div>
    <nav id="sections" aria-label="Sections"></nav>
    <div id="links" style="margin-top:10px"></div>
  </div>
</div>

<div id="tip"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<div id="veil">booting…</div>

<script type="module" src="room.js"></script>
</body>
</html>
